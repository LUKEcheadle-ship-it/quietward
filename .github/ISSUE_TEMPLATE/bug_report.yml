name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, bypasses, credentials, private host data, malware, or exploit details here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Windows 11
        - Debian 12
        - Other Linux distribution
        - Development/test environment
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the behavior without including private logs, addresses, usernames, credentials, or scanner databases.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, private host identifiers, raw IP addresses, logs, malware, scanner data, and other sensitive material.
          required: true
        - label: This is not a vulnerability report or containment request.
          required: true
