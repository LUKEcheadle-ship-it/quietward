name: Feature request
description: Propose a bounded observation-only improvement
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        QuietWard's experimental public alpha is observation-only. Requests for automatic quarantine, deletion, process termination, firewall changes, package installation, cloud telemetry, or public listeners require a separate threat-model discussion and will not be accepted as ordinary feature requests.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, permissions, data retained, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and safety impact
      description: Explain how raw host data, secrets, network identifiers, and action authority remain bounded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance tests
      description: Include repeatability, first-run baseline, false-positive, resource, restart, and zero-action tests where relevant.
    validations:
      required: true
